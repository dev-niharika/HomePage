<div class="content">

    Welcome to Devally <span class="green">Lorem</span>, ipsum dolor sit amet.

  </div>
  <div class="icon-container">
    <i class="fa-solid fa-sun " style="color: gold; border-radius: 70%;font-size: 40px;" (click)="showIcons()"></i>
    <div class="hidden-icons" [ngClass]="{'show': showHiddenIcons}">

      <i class="fa-solid fa-circle" style="color:rgb(50, 49, 88); border:2px solid white; border-radius: 50%;" (click)="onToggleChange('purple')"></i>
      <i class="fa-solid fa-circle" style="color: #2a2929; border:2px solid white;border-radius: 50%;" (click)="onToggleChange('grey')"></i>
      <i class="fa-solid fa-circle" style="color: rgb(19 7 37); border:2px solid white;border-radius: 50%;" (click)="onToggleChange('blue')"></i>
    </div>
</div>
